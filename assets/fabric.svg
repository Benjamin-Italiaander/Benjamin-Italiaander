<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" width="840" height="300" role="img" aria-labelledby="t d">
  <title id="t">EVPN/VXLAN leaf-spine fabric</title>
  <desc id="d">Two spine switches running the BGP EVPN control plane, fully meshed to four leaf switches acting as VTEPs, which connect Kubernetes, Proxmox/KVM, NVIDIA DGX over RoCEv2, and Ceph storage. Animated packets flow across the fabric.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1a20"/>
      <stop offset=".55" stop-color="#14303a"/>
      <stop offset="1" stop-color="#1f4250"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a6b84"/>
      <stop offset="1" stop-color="#1b4556"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20505f"/>
      <stop offset="1" stop-color="#173a46"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
  </defs>

  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .lbl  { fill: #ffffff; font-size: 13px; font-weight: 700; text-anchor: middle; }
    .sub  { fill: #9fd8ee; font-size: 9.5px; text-anchor: middle; letter-spacing: .5px; }
    .wl   { fill: #d7e9ef; font-size: 11.5px; text-anchor: middle; }
    .hdr  { fill: #36bcf7; font-size: 11px; font-weight: 700; letter-spacing: 2px; }
    .tag  { fill: #7fa9b8; font-size: 10px; text-anchor: end; letter-spacing: .5px; }
    .link { stroke: #36bcf7; stroke-opacity: .35; stroke-width: 1.6; fill: none; }
    .acc  { stroke: #3da639; stroke-opacity: .55; stroke-width: 1.4; stroke-dasharray: 3 4; }
    .gpu  { stroke: #76b900; stroke-opacity: .8; stroke-width: 1.8; stroke-dasharray: 3 4; }
    .dash { animation: flow 1.2s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -14; } }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
  </style>

  <!-- card -->
  <rect width="840" height="300" rx="16" fill="url(#bg)"/>
  <rect width="840" height="300" rx="16" fill="url(#grid)"/>
  <rect x=".5" y=".5" width="839" height="299" rx="16" fill="none" stroke="#36bcf7" stroke-opacity=".25"/>

  <text x="28" y="34" class="hdr">EVPN / VXLAN · LEAF-SPINE FABRIC</text>
  <text x="812" y="34" class="tag">BGP EVPN · VTEP · ANYCAST GW · SYMMETRIC IRB</text>

  <!-- spine ⇄ leaf full mesh -->
  <g class="link">
    <path id="a1" d="M330 92 L150 158"/><path id="a2" d="M330 92 L330 158"/>
    <path id="a3" d="M330 92 L510 158"/><path id="a4" d="M330 92 L690 158"/>
    <path id="b1" d="M510 92 L150 158"/><path id="b2" d="M510 92 L330 158"/>
    <path id="b3" d="M510 92 L510 158"/><path id="b4" d="M510 92 L690 158"/>
  </g>

  <!-- leaf ⇄ workload -->
  <path d="M150 192 L150 236" class="acc dash"/>
  <path d="M330 192 L330 236" class="acc dash"/>
  <path d="M510 192 L510 236" class="gpu dash"/>
  <path d="M690 192 L690 236" class="acc dash"/>

  <!-- packets -->
  <g filter="url(#glow)">
    <circle r="3.2" fill="#36bcf7"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#a1"/></animateMotion></circle>
    <circle r="3.2" fill="#36bcf7"><animateMotion dur="1.8s" begin="-.4s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#a3"/></animateMotion></circle>
    <circle r="3.2" fill="#36bcf7"><animateMotion dur="2.6s" begin="-.9s" repeatCount="indefinite"><mpath href="#a4"/></animateMotion></circle>
    <circle r="3.2" fill="#36bcf7"><animateMotion dur="2s" begin="-.2s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#b1"/></animateMotion></circle>
    <circle r="3.2" fill="#36bcf7"><animateMotion dur="1.6s" begin="-1.1s" repeatCount="indefinite"><mpath href="#b2"/></animateMotion></circle>
    <circle r="3.2" fill="#76b900"><animateMotion dur="1.2s" begin="-.6s" repeatCount="indefinite"><mpath href="#b3"/></animateMotion></circle>
    <circle r="3.2" fill="#76b900"><animateMotion dur="1.2s" begin="0s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#a3"/></animateMotion></circle>
    <circle r="3.2" fill="#36bcf7"><animateMotion dur="2.4s" begin="-1.4s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#b4"/></animateMotion></circle>
    <circle r="3.2" fill="#36bcf7"><animateMotion dur="2.1s" begin="-.7s" repeatCount="indefinite"><mpath href="#a2"/></animateMotion></circle>
  </g>

  <!-- spines -->
  <g>
    <rect x="260" y="58" width="140" height="36" rx="18" fill="url(#spine)" stroke="#36bcf7" stroke-width="1.5"/>
    <circle cx="279" cy="76" r="4" fill="#36bcf7" class="pulse" filter="url(#glow)"/>
    <text x="336" y="81" class="lbl">SPINE 1</text>
    <rect x="440" y="58" width="140" height="36" rx="18" fill="url(#spine)" stroke="#36bcf7" stroke-width="1.5"/>
    <circle cx="459" cy="76" r="4" fill="#36bcf7" class="pulse" filter="url(#glow)"/>
    <text x="516" y="81" class="lbl">SPINE 2</text>
  </g>

  <!-- leaves -->
  <g>
    <rect x="90"  y="158" width="120" height="34" rx="8" fill="url(#leaf)" stroke="#36bcf7" stroke-opacity=".7"/>
    <text x="150" y="173" class="lbl">LEAF 1</text><text x="150" y="186" class="sub">VTEP</text>
    <rect x="270" y="158" width="120" height="34" rx="8" fill="url(#leaf)" stroke="#36bcf7" stroke-opacity=".7"/>
    <text x="330" y="173" class="lbl">LEAF 2</text><text x="330" y="186" class="sub">VTEP</text>
    <rect x="450" y="158" width="120" height="34" rx="8" fill="url(#leaf)" stroke="#76b900" stroke-opacity=".9"/>
    <text x="510" y="173" class="lbl">LEAF 3</text><text x="510" y="186" class="sub">VTEP · RoCEv2</text>
    <rect x="630" y="158" width="120" height="34" rx="8" fill="url(#leaf)" stroke="#36bcf7" stroke-opacity=".7"/>
    <text x="690" y="173" class="lbl">LEAF 4</text><text x="690" y="186" class="sub">VTEP</text>
  </g>

  <!-- workloads -->
  <g>
    <rect x="80"  y="236" width="140" height="30" rx="15" fill="#0b1a20" stroke="#3da639" stroke-opacity=".7"/>
    <text x="150" y="255" class="wl">Kubernetes</text>
    <rect x="260" y="236" width="140" height="30" rx="15" fill="#0b1a20" stroke="#3da639" stroke-opacity=".7"/>
    <text x="330" y="255" class="wl">Proxmox · KVM</text>
    <rect x="440" y="236" width="140" height="30" rx="15" fill="#0b1a20" stroke="#76b900" stroke-width="1.6"/>
    <text x="510" y="255" class="wl" fill="#b6f24a" style="fill:#b6f24a;font-weight:700">NVIDIA DGX</text>
    <rect x="620" y="236" width="140" height="30" rx="15" fill="#0b1a20" stroke="#3da639" stroke-opacity=".7"/>
    <text x="690" y="255" class="wl">Ceph storage</text>
  </g>

  <text x="812" y="288" class="tag" xml:space="preserve">underlay: eBGP · ECMP · BFD  │  overlay: VXLAN · multi-tenant VRFs</text>
</svg>
